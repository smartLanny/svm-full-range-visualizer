<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090d" />
    <title>SVM 全范围可视化</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages serves the repository root, where this file is the unbuilt Vite entry: open the
      // offline release instead. Built pages no longer reference /src/main.tsx, so this never fires there.
      if (/\.github\.io$/.test(location.hostname) && document.querySelector('script[src="/src/main.tsx"]'))
        location.replace('release/SVM-Visualizer.html' + location.hash);
    </script>
  </body>
</html>
